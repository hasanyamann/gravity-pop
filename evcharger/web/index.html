<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Şarj</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0b1120;
    --card: #151d2e;
    --card-2: #1b2438;
    --line: #26314a;
    --text: #e8edf7;
    --muted: #8b98b3;
    --accent: #3ddc84;
    --accent-dim: #1f8a52;
    --danger: #ff5f56;
    --warn: #ffb020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 520px;
    margin-inline: auto;
    min-height: 100vh;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    background: var(--card-2); border: 1px solid var(--line);
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,132,.16); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,176,32,.16); animation: pulse 1.4s ease-in-out infinite; }
  .dot.off { background: var(--danger); box-shadow: 0 0 0 3px rgba(255,95,86,.14); }
  @keyframes pulse { 50% { opacity: .35; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }

  .power { text-align: center; padding-bottom: 6px; }
  .power .value { font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .power .unit { font-size: 20px; color: var(--muted); font-weight: 600; margin-left: 6px; letter-spacing: 0; }
  .power .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 10px; }
  canvas { width: 100%; height: 72px; display: block; margin-top: 10px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .stat .k { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .8px; }

  .soc { margin-top: 12px; }
  .soc .bar { height: 10px; border-radius: 6px; background: var(--card-2); overflow: hidden; border: 1px solid var(--line); }
  .soc .fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); width: 0; transition: width .6s ease; }
  .soc .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13px; }
  .details div { display: flex; justify-content: space-between; gap: 8px; }
  .details span:first-child { color: var(--muted); }
  .details span:last-child { font-variant-numeric: tabular-nums; text-align: right; }

  button.action {
    width: 100%; padding: 17px; border-radius: 14px; border: 0;
    font-size: 17px; font-weight: 700; color: #06121e; background: var(--accent);
    cursor: pointer; transition: transform .08s, opacity .2s; margin-bottom: 12px;
  }
  button.action:active { transform: scale(.985); }
  button.action.stop { background: var(--danger); color: #fff; }
  button.action:disabled { opacity: .45; cursor: not-allowed; }

  .ghost {
    width: 100%; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: pointer;
  }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 20px 0 8px; }
  .hist { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap: 10px; }
  .hist:last-child { border-bottom: 0; }
  .hist .when { color: var(--muted); font-size: 12px; }
  .hist .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .hist .num small { color: var(--muted); display: block; font-size: 11px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 0; }

  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 140%); background: var(--card-2); color: var(--text);
    border: 1px solid var(--line); padding: 12px 18px; border-radius: 12px;
    font-size: 14px; max-width: 90vw; text-align: center; transition: transform .28s ease;
    z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast.err { border-color: var(--danger); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Ev Şarj İstasyonu</h1>
    <div class="sub" id="device">bağlantı bekleniyor…</div>
  </div>
  <div class="pill"><span class="dot" id="dot"></span><span id="statusText">—</span></div>
</header>

<div class="card power">
  <div class="label">Anlık Güç</div>
  <div><span class="value" id="power">0.0</span><span class="unit">kW</span></div>
  <canvas id="chart" width="600" height="144"></canvas>
</div>

<div class="stats">
  <div class="stat"><div class="v" id="energy">0.00</div><div class="k">kWh</div></div>
  <div class="stat"><div class="v" id="elapsed">00:00</div><div class="k">Süre</div></div>
  <div class="stat"><div class="v" id="cost">0.00</div><div class="k" id="costUnit">TL</div></div>
</div>

<div class="card soc" id="socCard" hidden>
  <div class="row"><span>Araç bataryası</span><span id="socText">—</span></div>
  <div class="bar"><div class="fill" id="socFill"></div></div>
</div>

<div class="card">
  <div class="details">
    <div><span>Durum</span><span id="dStatus">—</span></div>
    <div><span>Gerilim</span><span id="dVolt">—</span></div>
    <div><span>Akım</span><span id="dCurr">—</span></div>
    <div><span>Ortalama</span><span id="dAvg">—</span></div>
    <div><span>Süre (dk)</span><span id="dMin">—</span></div>
    <div><span>Birim fiyat</span><span id="dPrice">—</span></div>
  </div>
</div>

<button class="action" id="actionBtn" disabled>Bağlanıyor…</button>
<button class="ghost" id="refreshBtn">Ölçümü yenile</button>

<h2>Geçmiş Şarjlar</h2>
<div class="card" id="history"><div class="empty">Henüz kayıt yok</div></div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // Sunucu bir belirtec istiyorsa adres cubugundan ?token=... ile bir kez
  // verilir, sonrasi icin saklanir.
  var params = new URLSearchParams(location.search);
  if (params.has("token")) {
    localStorage.setItem("evToken", params.get("token"));
    history.replaceState(null, "", location.pathname);
  }
  var TOKEN = localStorage.getItem("evToken") || "";

  var el = function (id) { return document.getElementById(id); };
  var state = null;          // sunucudan gelen son goruntu
  var cp = null;             // gosterdigimiz sarj cihazi
  var baseDuration = 0;      // son mesajdaki sure
  var baseClock = 0;         // o mesajin geldigi yerel an
  var busy = false;          // komut ucusta
  var ws = null, retry = 1000;

  // ---------------------------------------------------------------- ag
  function apiHeaders() {
    var h = { "Content-Type": "application/json" };
    if (TOKEN) h["X-Auth-Token"] = TOKEN;
    return h;
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var url = proto + "//" + location.host + "/api/ws" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
    ws = new WebSocket(url);

    ws.onopen = function () { retry = 1000; };
    ws.onmessage = function (ev) {
      try { apply(JSON.parse(ev.data)); } catch (e) { /* bozuk mesaj, atla */ }
    };
    ws.onclose = function () {
      setOffline();
      // Telefon uykuya girip uyandiginda hemen geri baglanmali; artan
      // bekleme ile deniyoruz ama ust siniri kisa tutuyoruz.
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 10000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function setOffline() {
    el("dot").className = "dot off";
    el("statusText").textContent = "Bağlantı yok";
    el("device").textContent = "sunucuya ulaşılamıyor";
    el("actionBtn").disabled = true;
    el("actionBtn").textContent = "Bağlantı yok";
  }

  // ------------------------------------------------------------- durum
  var STATUS_TR = {
    Available: "Boşta", Preparing: "Kablo takılı", Charging: "Şarj oluyor",
    SuspendedEV: "Araç bekletiyor", SuspendedEVSE: "Cihaz bekletiyor",
    Finishing: "Tamamlanıyor", Reserved: "Rezerve", Unavailable: "Kullanılamıyor",
    Faulted: "Arıza", Offline: "Çevrimdışı"
  };

  function apply(snap) {
    state = snap;
    var list = snap.charge_points || [];
    cp = list.length ? list[0] : null;

    if (!cp) {
      el("dot").className = "dot off";
      el("statusText").textContent = "Cihaz yok";
      el("device").textContent = "hiçbir şarj cihazı bağlanmadı";
      el("actionBtn").disabled = true;
      el("actionBtn").textContent = "Cihaz bağlı değil";
      renderIdle();
      renderHistory(snap.history || []);
      return;
    }

    var s = cp.session;
    // Sureyi yerel saatle akitiyoruz: olcumler 10 saniyede bir gelse de
    // sayac saniye saniye ilerlesin.
    baseDuration = s ? s.duration_s : 0;
    baseClock = performance.now();

    el("device").textContent = [cp.vendor, cp.model].filter(Boolean).join(" ") || cp.cp_id;
    el("statusText").textContent = STATUS_TR[cp.status] || cp.status;
    el("dot").className = "dot " + (!cp.online ? "off" : (cp.charging ? "busy" : "on"));
    el("dStatus").textContent = STATUS_TR[cp.status] || cp.status;

    var tariff = snap.tariff || {};
    el("dPrice").textContent = tariff.price_per_kwh != null
      ? tariff.price_per_kwh.toFixed(2) + " " + (tariff.currency || "") + "/kWh" : "—";
    el("costUnit").textContent = tariff.currency || "TL";

    if (s) { renderSession(s); } else { renderIdle(); }
    renderButton();
    renderHistory(snap.history || []);
  }

  function renderSession(s) {
    el("power").textContent = s.power_kw.toFixed(1);
    el("energy").textContent = s.energy_kwh.toFixed(2);
    el("cost").textContent = s.cost.toFixed(2);
    el("dAvg").textContent = s.avg_power_kw ? s.avg_power_kw.toFixed(1) + " kW" : "—";
    el("dVolt").textContent = s.voltage_v ? s.voltage_v.toFixed(0) + " V" : "—";

    var phases = Object.keys(s.current_a || {}).sort();
    el("dCurr").textContent = phases.length
      ? phases.map(function (p) { return s.current_a[p].toFixed(0); }).join(" / ") + " A" : "—";

    if (s.soc != null) {
      el("socCard").hidden = false;
      el("socText").textContent = "%" + s.soc.toFixed(0);
      el("socFill").style.width = s.soc + "%";
    } else {
      el("socCard").hidden = true;
    }

    drawChart(s.power_series || []);
    tick();
  }

  function renderIdle() {
    el("power").textContent = "0.0";
    el("energy").textContent = "0.00";
    el("cost").textContent = "0.00";
    el("elapsed").textContent = "00:00";
    el("dMin").textContent = "—";
    el("dAvg").textContent = "—";
    el("dVolt").textContent = "—";
    el("dCurr").textContent = "—";
    el("socCard").hidden = true;
    drawChart([]);
  }

  function renderButton() {
    var btn = el("actionBtn");
    if (busy) { btn.disabled = true; return; }

    if (!cp || !cp.online) {
      btn.disabled = true; btn.className = "action";
      btn.textContent = "Cihaz çevrimdışı";
    } else if (cp.pending) {
      // Komutu cihaz kabul etti ama henuz sarj basla(ma)di.
      btn.disabled = true; btn.className = "action";
      btn.textContent = cp.pending.action === "start" ? "Başlatılıyor…" : "Durduruluyor…";
    } else if (cp.charging) {
      btn.disabled = false; btn.className = "action stop";
      btn.textContent = "Şarjı Durdur";
    } else {
      btn.disabled = false; btn.className = "action";
      btn.textContent = "Şarjı Başlat";
    }
  }

  // Sunucu her saniye yayin yapmasa da sayac akici gorunsun.
  function tick() {
    if (!cp || !cp.session) return;
    var secs = baseDuration + (performance.now() - baseClock) / 1000;
    el("elapsed").textContent = fmtDuration(secs);
    el("dMin").textContent = (secs / 60).toFixed(1) + " dk";
  }
  setInterval(tick, 1000);

  function fmtDuration(total) {
    total = Math.max(0, Math.floor(total));
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return h ? pad(h) + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
  }

  // -------------------------------------------------------------- grafik
  function drawChart(series) {
    var canvas = el("chart"), ctx = canvas.getContext("2d");
    var ratio = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = 72;
    if (canvas.width !== w * ratio) { canvas.width = w * ratio; canvas.height = h * ratio; }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (series.length < 2) return;

    var maxPower = 1;
    for (var i = 0; i < series.length; i++) maxPower = Math.max(maxPower, series[i][1]);
    maxPower *= 1.15;

    var t0 = series[0][0], t1 = series[series.length - 1][0];
    var span = Math.max(1, t1 - t0);
    var x = function (t) { return ((t - t0) / span) * w; };
    var y = function (p) { return h - (p / maxPower) * (h - 6) - 3; };

    // Cizgiyi bir kere kuruyoruz; ayni yolu once altini dolduran alan
    // icin, sonra cizgi icin kullaniyoruz.
    var line = new Path2D();
    line.moveTo(x(series[0][0]), y(series[0][1]));
    for (var j = 1; j < series.length; j++) line.lineTo(x(series[j][0]), y(series[j][1]));

    var area = new Path2D(line);
    area.lineTo(w, h); area.lineTo(0, h); area.closePath();

    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "rgba(61,220,132,.28)");
    grad.addColorStop(1, "rgba(61,220,132,0)");
    ctx.fillStyle = grad; ctx.fill(area);

    ctx.strokeStyle = "#3ddc84"; ctx.lineWidth = 2;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.stroke(line);
  }

  // ------------------------------------------------------------- komutlar
  function post(path, body) {
    busy = true; renderButton();
    return fetch(path, { method: "POST", headers: apiHeaders(), body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        toast(res.data.message || (res.ok ? "Tamam" : "İşlem başarısız"), !res.data.ok);
      })
      .catch(function () { toast("Sunucuya ulaşılamadı", true); })
      .then(function () { busy = false; renderButton(); });
  }

  el("actionBtn").onclick = function () {
    if (!cp) return;
    if (cp.charging) {
      // Yanlislikla dokunup aracin sarjini kesmek can sikici olur.
      if (!confirm("Şarj durdurulsun mu?")) return;
      post("/api/stop", {});
    } else {
      post("/api/start", {});
    }
  };

  el("refreshBtn").onclick = function () { post("/api/refresh", {}); };

  var toastTimer = null;
  function toast(message, isError) {
    var t = el("toast");
    t.textContent = message;
    t.className = "show" + (isError ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, 3200);
  }

  // -------------------------------------------------------------- geçmiş
  function renderHistory(items) {
    var box = el("history");
    if (!items.length) { box.innerHTML = '<div class="empty">Henüz kayıt yok</div>'; return; }
    box.innerHTML = items.slice(0, 10).map(function (h) {
      var when = new Date(h.started_at * 1000);
      var date = when.toLocaleDateString("tr-TR", { day: "2-digit", month: "short" });
      var time = when.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
      return '<div class="hist">' +
        '<div><div>' + date + " " + time + '</div>' +
        '<div class="when">' + h.duration_text + " · " + (h.cost || 0).toFixed(2) + " " + (h.currency || "") + '</div></div>' +
        '<div class="num">' + h.energy_kwh.toFixed(2) + ' kWh<small>' + (h.avg_power_kw || 0).toFixed(1) + ' kW ort.</small></div>' +
        '</div>';
    }).join("");
  }

  // Telefon uykudan donunce soket olmus olabilir; hemen tazeleyelim.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && ws && ws.readyState !== WebSocket.OPEN) {
      try { ws.close(); } catch (e) {}
      connect();
    }
  });

  window.addEventListener("resize", function () { if (cp && cp.session) drawChart(cp.session.power_series || []); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }

  connect();
})();
</script>
</body>
</html>
